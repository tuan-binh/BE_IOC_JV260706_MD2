spring:
  application:
    name: demo-mapstruct

  datasource:
    url: jdbc:postgresql://localhost:5432/demo_mapstruct
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
